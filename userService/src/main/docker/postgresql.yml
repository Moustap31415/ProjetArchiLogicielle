name: userservice
services:
  postgresql:
    image: postgres:17.4
    environment:
      - POSTGRES_USER=userService
      - POSTGRES_PASSWORD=userService
      - POSTGRES_DB=userService
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - 127.0.0.1:1032:5432
